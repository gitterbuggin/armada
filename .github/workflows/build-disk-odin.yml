---
# Build the SDM845 AYN Odin flashable disk image on a native arm64 runner.
#
# The disk-assembly step (bootc-image-builder) needs a real arm64 kernel — it
# cannot run under x86 qemu-user emulation (crun memfd / runc CLONE_PARENT /
# podman lock ABI all fail there). This runs it natively instead.
#
# Prereq: push the Odin bootc image (the `localhost/armada:latest` you built,
# which is arm64 content) to a registry, e.g.:
#   podman tag localhost/armada:latest ghcr.io/<owner>/armada:odin
#   podman push ghcr.io/<owner>/armada:odin
# Then run this workflow (Actions tab -> Build Odin disk image -> Run workflow).
name: Build Odin disk image

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Odin bootc image ref to build the disk from (blank = ghcr.io/<owner>/armada:odin)"
        type: string
        default: ""

env:
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Odin disk image
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: read

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Checkout armada
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Checkout armada-packages (for uboot-odin)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.repository_owner }}/armada-packages
          ref: sdm845-odin
          path: _armada-packages

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            containernetworking-plugins curl jq pigz podman python3 zstd

      - name: Check build recipes
        uses: ublue-os/just-action@30ab4659369934b65b655bf8d2fa4ddd6547d384 # v3

      - name: Build U-Boot (uboot-odin)
        run: |
          set -euxo pipefail
          # Native arm64 here, so uboot-odin/build.sh cross-compiles nothing —
          # it builds in a native aarch64 container.
          (cd _armada-packages/uboot-odin && ./build.sh)
          ls -lh _armada-packages/uboot-odin/out/

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Odin disk image
        env:
          UBOOT_DIR: ${{ github.workspace }}/_armada-packages/uboot-odin/out
        run: |
          set -euxo pipefail
          JUST_BIN=$(command -v just)
          sudo git config --global --add safe.directory "${GITHUB_WORKSPACE}"

          REF="${{ inputs.image }}"
          if [[ -z "${REF}" ]]; then
            OWNER="${{ github.repository_owner }}"
            REF="ghcr.io/${OWNER,,}/armada:odin"
          fi
          IMG_REPO="${REF%:*}"
          IMG_TAG="${REF##*:}"
          echo "Building Odin disk from ${IMG_REPO}:${IMG_TAG}"

          # UBOOT_DIR must survive sudo (finalize defaults it under $HOME).
          sudo --preserve-env=UBOOT_DIR,BIB_IMAGE \
            "${JUST_BIN}" build-armada-image-odin "${IMG_REPO}" "${IMG_TAG}"

          sudo chown -R "$(id -u):$(id -g)" output
          IMG=$(find output -maxdepth 1 -name 'armada-odin-*.img.gz' -type f -print -quit)
          sha256sum "${IMG}" > "${IMG}.sha256"
          ls -lh "${IMG}" "${IMG}.sha256"

      - name: Upload disk image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: armada-odin-disk-image
          path: |
            output/armada-odin-*.img.gz
            output/armada-odin-*.img.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true
