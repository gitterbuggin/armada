# Self-heal the sdm845 display-init race. The panel's real DRM driver (msm,
# card1 / DSI-1) probes slightly after the graphical target comes up; the EFI
# handover framebuffer (simpledrm, card0) is there first. If SDDM starts in
# that window it fails to get a usable display and exits, leaving the bare
# console (a blinking cursor) with no compositor — and nothing relaunches it,
# so the device looks like a "flaky boot". Restart SDDM so the retry, a couple
# seconds later with msm/card1 ready, wins. (Relogin=true only retries the
# session under an already-running SDDM; it can't cover SDDM's own startup.)
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=2
