# The WCN3990 (and other mainline-Qualcomm Wi-Fi) has no factory MAC visible
# to the kernel, which generates a random one each boot — so DHCP hands out a
# new IP every time. Derive a stable MAC from the machine-id instead so the
# device keeps one identity across boots (and can get a DHCP reservation).
[device]
wifi.scan-rand-mac-address=no

[connection]
wifi.cloned-mac-address=stable
ethernet.cloned-mac-address=stable
