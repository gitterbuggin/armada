match-architectures = ["aarch64"]

kargs = [
    "rootwait",
    "rootflags=noatime,compress=zstd:1",
    # No console=tty0: keep kernel printk off the display so Plymouth owns it.
    # The kernel DT's stdout-path adds a ttyMSM0 serial console; without
    # ignore-serial-consoles Plymouth treats that as the console and skips the
    # graphical splash, dumping logs on tty0 instead. Serial still logs.
    "rhgb",
    "quiet",
    "plymouth.enable=1",
    "plymouth.ignore-serial-consoles",
    "loglevel=3",

    "allow_mismatched_32bit_el0",
    "fw_devlink.strict=1",
    "pcie_ports=compat",

    "irqaffinity=0-1",

    "psi=1",
    "cgroup_disable=pressure",
    "cgroup.memory=nokmem,nosocket",

    "cpufreq.default_governor=schedutil",

    "swiotlb=8192",

    # Odin micro-HDMI (LT8912B bridge) has no DDC/EDID wire, so DRM gets an
    # empty modelist and never lights the pipe. Pin a fixed 1080p60 CVT
    # reduced-blanking mode: plain 1920x1080@60 generates a 172.78 MHz GTF
    # clock, above the LT8912B driver's 150 MHz limit. Force the connector on:
    # without the fabricated HPD GPIO, the bridge's internal cable check is
    # unreliable (observed disconnected with a sink attached and unknown when
    # unplugged). Blind drive — correct for a sink we can't detect or query.
    # Swap for a captured EDID via
    # drm_kms_helper.edid_firmware=HDMI-A-1:edid/odin-hdmi.bin later if a
    # specific sink needs different timings/ranges.
    "video=HDMI-A-1:1920x1080MR@60e",
]
