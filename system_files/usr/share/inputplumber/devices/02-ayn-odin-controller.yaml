# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
version: 1
kind: CompositeDevice
name: AYN Odin Layout

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AYN Odin
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AYN Odin M2

single_source: false

source_devices:
  - group: gamepad
    evdev:
      phys_path: odin-gamepad/input0
      handler: event*
    capability_map_id: ayn_odin
  # The Odin's rumble motor is a SEPARATE input device (pmi8998 SPMI haptics,
  # qcom-spmi-haptics driver) — odin-gamepad has no force feedback of its own.
  # Add it as a source so InputPlumber forwards the virtual controller's rumble
  # (PackedRumbleReport -> evdev FF_RUMBLE) to the motor. Verified on-device.
  - group: gamepad
    evdev:
      name: spmi_haptics
      handler: event*
  # The IMU (accel+gyro) is behind the SLPI DSP with no evdev/IIO node of its own;
  # armada-imu-bridge streams it (via libssc) to a uinput device. InputPlumber
  # only adopts *virtual* devices whose name is in its hardcoded whitelist, which
  # already includes Sunshine's virtual motion sensors — so the daemon names it
  # that (see armada-imu-bridge.c / ARMADA_IMU_NAME). imu_generic maps its
  # ABS_X/Y/Z -> accelerometer and ABS_RX/RY/RZ -> gyro, feeding the deck target's
  # gyro -> Steam Input motion controls.
  - group: imu
    evdev:
      name: Sunshine gamepad (virtual) motion sensors
      handler: event*
    capability_map_id: imu_generic

options:
  auto_manage: true

target_devices:
  - deck-uhid
  - keyboard
