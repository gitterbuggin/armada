# Per-device config for hexagonrpcd-sdsp.service (AYN Odin, SDM845). The service
# is ConditionPathExists-gated on this file, so its presence opts the Odin into
# the SLPI sensor stack. hexagonrpcd serves this dir as the FastRPC root (-R); the
# SLPI sensor PD pulls its registry/config from here. Files live at
# .../AYN/odin (lowercase, from gitlab.com/jenneron/firmware-ayn-odin).
hexagonrpcd_fw_dir=/usr/share/qcom/sdm845/AYN/odin
