# UCM for the AYN Odin (SDM845, wcd934x + 2x wsa881x). Card longname:
# ayn-AYNOdin.
#
# Previously a symlink to the shared Qualcomm/sdm845 profile (as in pmOS),
# but that profile Includes codecs/{wcd934x,wsa881x} sequence files that
# Fedora's alsa-ucm-conf does NOT ship (empty dirs) — UCM failed to parse and
# the card came up with a virgin (silent) mixer. Everything needed is inlined
# here and in ayn-AYNOdin-HiFi.conf instead.
Syntax 4

SectionUseCase."HiFi" {
	File "/conf.d/sdm845/ayn-AYNOdin-HiFi.conf"
	Comment "HiFi quality Music."
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"

# wcd934x init (inline of codecs/wcd934x/init.conf), digital volumes at 0 dB
# (84) — the validated clean level for the COMP/DRE speaker path on this
# device. Speaker loudness is a known open item (DRE gain expansion
# under-delivers; see docs/PORT-STATUS.md).
BootSequence [
	cset "name='RX1 Digital Volume' 84"
	cset "name='RX2 Digital Volume' 84"
	cset "name='RX7 Digital Volume' 84"
	cset "name='RX8 Digital Volume' 84"
	cset "name='ADC2 Volume' 12"
]

LibraryConfig.remap.Config {

	ctl.default.map {
		# Merge two mono controls into one stereo
		"name='HP Digital Volume'" {
			"name='RX1 Digital Volume'".vindex.0 0
			"name='RX2 Digital Volume'".vindex.1 0
		}
		"name='Speaker Digital Volume'" {
			"name='RX7 Digital Volume'".vindex.0 0
			"name='RX8 Digital Volume'".vindex.1 0
		}
	}
}
