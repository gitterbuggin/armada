# AYN Odin (SDM845): the q6asm PCM path mishandles S24_LE (samples land
# ~48 dB down — the "quiet speakers through PipeWire" bug), while S16_LE is
# bit-perfect. Pin PipeWire's device format to S16 until the kernel-side
# 24-bit sample handling is fixed. Verified on-device 2026-07-25: identical
# tone loud at S16, whisper-quiet at PipeWire's negotiated S24_LE.
monitor.alsa.rules = [
  {
    matches = [
      { api.alsa.card.longname = "~ayn-AYNOdin.*" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
      }
    }
  }
]
